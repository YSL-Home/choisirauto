name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build Next.js + Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: env.CF_API_TOKEN != ''
        run: |
          npx wrangler pages deploy out/ \
            --project-name="${{ secrets.CF_PROJECT_NAME || 'choisirauto' }}" \
            --commit-dirty=true \
            --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Cloudflare secrets missing
        if: env.CF_API_TOKEN == ''
        run: |
          echo "::warning::CF_API_TOKEN non configuré dans les secrets du repo — build validé mais non déployé sur Cloudflare Pages."
